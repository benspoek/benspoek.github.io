        clearLocalStorageCallback: null,
      });
      const loginForm = document.getElementById("project-login");
      const passwordInput = document.getElementById("project-password");
      const loginButton = document.getElementById("login-submit");
      const loginError = document.getElementById("login-error");
      const incorrectPasswordMessage = document.getElementById("incorrect-password-message").textContent.trim();
      const buttonLabel = loginButton.textContent;
      let loginPending = false;

      function showLoginError(message) {
        loginError.textContent = message;
        loginError.hidden = false;
        passwordInput.setAttribute("aria-invalid", "true");
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loginPending) return;
        loginError.hidden = true;
        loginError.textContent = "";
        passwordInput.removeAttribute("aria-invalid");
        if (!passwordInput.value) {
          showLoginError("Bitte geben Sie das Projektpasswort ein.");
          passwordInput.focus();
          return;
        }
        const password = passwordInput.value;
        passwordInput.value = "";
        loginPending = true;
        passwordInput.disabled = true;
        loginButton.disabled = true;
        loginButton.setAttribute("aria-busy", "true");
        loginButton.textContent = "Wird geöffnet …";
        try {
          const result = await staticrypt.handleDecryptionOfPage(password, false);
          if (!result.isSuccessful) {
            showLoginError(incorrectPasswordMessage || "Das Projektpasswort ist nicht korrekt. Bitte versuchen Sie es erneut.");
          }
        } catch {
          showLoginError("Die Darstellung konnte nicht geöffnet werden. Bitte versuchen Sie es erneut in einem aktuellen Browser.");
        } finally {
          if (loginForm.isConnected) {
            loginPending = false;
            passwordInput.disabled = false;
            loginButton.disabled = false;
            loginButton.removeAttribute("aria-busy");
            loginButton.textContent = buttonLabel;
            passwordInput.focus();
          }
        }
      });
    </script>
  </body>
</html>
