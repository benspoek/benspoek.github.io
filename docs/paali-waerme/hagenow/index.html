        }
        const password = passwordInput.value;
        passwordInput.value = "";
        loginPending = true;
        passwordInput.disabled = true;
        loginButton.disabled = true;
        loginButton.setAttribute("aria-busy", "true");
        loginButton.textContent = "Wird geöffnet …";
        try {
          const result = await staticrypt.handleDecryptionOfPage(password, false);
          if (!result.isSuccessful) {
            showLoginError(incorrectPasswordMessage || "Das Projektpasswort ist nicht korrekt. Bitte versuchen Sie es erneut.");
          }
        } catch {
          showLoginError("Die Darstellung konnte nicht geöffnet werden. Bitte versuchen Sie es erneut in einem aktuellen Browser.");
        } finally {
          if (loginForm.isConnected) {
            loginPending = false;
            passwordInput.disabled = false;
            loginButton.disabled = false;
            loginButton.removeAttribute("aria-busy");
            loginButton.textContent = buttonLabel;
            passwordInput.focus();
          }
        }
      });
    </script>
  </body>
</html>
